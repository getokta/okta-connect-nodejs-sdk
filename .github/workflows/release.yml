name: Release

# Two ways in, both landing on the same gate:
#
#   - push a `v*` tag, or
#   - dispatch this workflow and let it create the tag at the commit it just
#     tested (useful when the operator's credentials can't push tag refs).
#
# Either way the full gate runs before anything is published, so a release can
# never be cut from a commit that doesn't typecheck, test and build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0. Defaults to package.json.'
        required: false
        type: string

permissions:
  contents: write # create the tag + GitHub Release
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-$PKG_VERSION}"
            VERSION="${VERSION#v}"
          fi

          # A tag that disagrees with package.json would publish a mislabelled
          # artifact — refuse rather than guess which one is right.
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Requested version $VERSION does not match package.json version $PKG_VERSION."
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          # Pull just this version's section out of CHANGELOG.md; fall back to a
          # pointer if the heading is missing, rather than shipping empty notes.
          awk -v version="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the details of this release." > release-notes.md
          fi

          cat release-notes.md

      - name: Pack the tarball
        run: npm pack

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version or delete the release first."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            # The tag is what triggered us, so it already exists upstream.
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              ./*.tgz
          else
            # Dispatched: create the tag at the exact commit we just tested.
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              ./*.tgz
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish --ignore-scripts
